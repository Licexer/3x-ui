name: Inbound Multiplier Tests

on:
  workflow_dispatch:
  push:
    branches:
      - inbound-multiplier

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Test all Go packages
        run: go test -count=1 ./...

      - name: Build isolated Linux x86_64 test binary
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -o x-ui-multiplier-test .

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: x-ui-multiplier-linux-amd64
          path: x-ui-multiplier-test
          if-no-files-found: error
          retention-days: 7
